<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Admin — SenActuPlus</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--red:#b3121c;--bg:#fff;--surf:#f3f3f2;--ink:#000;--txt:#2b2b2b;--line:#dcdcda;--mut:#6a6a68}
@media(prefers-color-scheme:dark){:root{--bg:#111;--surf:#1c1c1c;--ink:#f5f5f5;--txt:#d6d6d6;--line:#333;--mut:#999;--red:#e0343d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 Archivo,Arial,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
header{border-bottom:3px solid var(--ink);display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;color:var(--ink)}.logo img{width:40px;height:40px;border-radius:6px}.logo b{color:var(--red)}
h1{font-size:24px;color:var(--ink);margin:.5em 0}h2{font-size:18px;color:var(--ink);border-top:3px solid var(--ink);padding-top:10px;margin:28px 0 12px}
.box{background:var(--surf);padding:18px;border-radius:6px}
label{display:block;font-weight:700;font-size:13px;margin:10px 0 2px;color:var(--ink)}
input[type=text],input[type=email],input[type=password],input[type=url],select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.btn{background:var(--red);color:#fff;border:0;border-radius:6px;padding:10px 16px;font:700 15px Archivo,sans-serif;cursor:pointer}
.btn.sec{background:none;color:var(--ink);border:1px solid var(--line)}.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:wait}
.chk{display:inline-flex;gap:6px;align-items:center;margin:10px 18px 0 0;font-weight:600}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;text-transform:uppercase;color:var(--mut)}
.tg{font-size:11px;font-weight:700;padding:2px 7px;border-radius:3px;background:var(--line);color:var(--ink)}.tg.on{background:#1f7a3f;color:#fff}.tg.r{background:var(--red);color:#fff}
.msg{margin:10px 0;font-weight:600}.err{color:var(--red)}.ok{color:#1f7a3f}
.login{max-width:380px;margin:60px auto}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tw{overflow-x:auto}#prev{max-width:200px;border-radius:6px;margin-top:8px;display:block}
</style></head><body>
<header><a class="logo" href="/"><img src="/assets/logo.jpg" alt=""><span>Sen<b>Actu</b>Plus <small style="font-weight:500;color:var(--mut)">Admin</small></span></a>
<div class="row" id="bar" hidden><span id="who" style="color:var(--mut);font-size:13px"></span><a class="btn sec sm" href="/" target="_blank">Voir le site</a><button class="btn sec sm" id="out">Déconnexion</button></div></header>
<main class="wrap" id="app"></main>
<script src="/config.js"></script><script src="/assets/supabase.js"></script>
<script>
const C=window.SENACTU||{},app=document.getElementById("app"),$=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const CATS=[["politique","Politique"],["societe","Société"],["economie","Économie"],["sport","Sport"],["afrique","Afrique"],["international","International"],["culture","Culture"],["technologie","Technologie"]];
const slugify=t=>t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,60);
let sb,list=[],lastErr="";
const say=(t,ok)=>{const m=$("#m");if(m){m.textContent=t;m.className="msg "+(ok?"ok":"err")}};

function loginView(err=""){app.innerHTML=`<div class="login box"><h1>Espace rédaction</h1><p style="color:var(--mut)">Accès réservé à l'équipe SenActuPlus.</p>
<label for="e">E-mail</label><input type="email" id="e" autocomplete="username"><label for="p">Mot de passe</label><input type="password" id="p" autocomplete="current-password">
<p><button class="btn" id="go">Se connecter</button></p><div id="m" class="msg err">${esc(err)}</div></div>`;
$("#bar").hidden=true;const go=async()=>{const b=$("#go");b.disabled=true;
const {error}=await sb.auth.signInWithPassword({email:$("#e").value.trim(),password:$("#p").value});
if(error){b.disabled=false;return say("Identifiants incorrects.")}
await start()};
$("#go").onclick=go;$("#p").onkeydown=e=>{if(e.key==="Enter")go()}}

async function start(){const {data:{session}}=await sb.auth.getSession();if(!session)return loginView();
const {data:ok}=await sb.rpc("is_admin");
if(!ok){await sb.auth.signOut();return loginView("Ce compte n'a pas les droits d'administration.")}
$("#who").textContent=session.user.email;$("#bar").hidden=false;dash()}

async function load(){const {data,error}=await sb.from("articles").select("*").order("created_at",{ascending:false});
list=data||[];lastErr=error?error.message:""}

async function dash(){await load();
app.innerHTML=`<h1>Tableau de bord</h1><div class="row"><button class="btn" id="new">+ Nouvel article</button></div>
<div id="m" class="msg err">${esc(lastErr)}</div><h2>Articles (${list.length})</h2><div class="tw"><table><tr><th>Titre</th><th>Rubrique</th><th>Statut</th><th>Lectures</th><th></th></tr>
${list.map(a=>`<tr><td>${esc(a.title)}</td><td>${esc((CATS.find(c=>c[0]===a.category)||[0,a.category])[1])}</td>
<td><span class="tg ${a.published?"on":""}">${a.published?"Publié":"Brouillon"}</span> ${a.featured?'<span class="tg r">Une</span>':""} ${a.breaking?'<span class="tg r">Flash</span>':""}</td>
<td>${a.views}</td><td class="row"><button class="btn sec sm" data-e="${a.id}">Modifier</button><button class="btn sec sm" data-d="${a.id}">Supprimer</button></td></tr>`).join("")||'<tr><td colspan="5">Aucun article. Créez le premier !</td></tr>'}</table></div>`;
$("#new").onclick=()=>form();
app.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>form(list.find(a=>a.id==b.dataset.e)));
app.querySelectorAll("[data-d]").forEach(b=>b.onclick=async()=>{const a=list.find(x=>x.id==b.dataset.d);
if(!confirm(`Supprimer définitivement « ${a.title} » ?`))return;
const {error}=await sb.from("articles").delete().eq("id",a.id);error?say(error.message):dash()})}

function form(a={}){const n=!a.id;
app.innerHTML=`<p><a href="#" id="back" style="color:var(--red);font-weight:700">← Retour</a></p><h1>${n?"Nouvel article":"Modifier l'article"}</h1><div class="box">
<label for="t">Titre *</label><input type="text" id="t" maxlength="200" value="${esc(a.title)}">
<label for="c">Rubrique *</label><select id="c">${CATS.map(c=>`<option value="${c[0]}" ${a.category===c[0]?"selected":""}>${c[1]}</option>`).join("")}</select>
<label for="ch">Chapeau (résumé)</label><textarea id="ch" rows="2">${esc(a.chapo)}</textarea>
<label for="b">Texte (séparez les paragraphes par une ligne vide)</label><textarea id="b" rows="12">${esc(a.body)}</textarea>
<label for="au">Auteur</label><input type="text" id="au" value="${esc(a.author||"Rédaction")}">
<label for="tg">Mot-clé (tag)</label><input type="text" id="tg" value="${esc(a.tag)}">
<label for="f">Image (JPG/PNG/WebP, 5 Mo max)</label><input type="file" id="f" accept="image/jpeg,image/png,image/webp"><input type="hidden" id="iu" value="${esc(a.image_url)}">
<img id="prev" alt="" ${a.image_url?`src="${esc(a.image_url)}"`:"hidden"}>
<div><label class="chk"><input type="checkbox" id="pu" ${a.published!==false?"checked":""}> Publié</label><label class="chk"><input type="checkbox" id="fe" ${a.featured?"checked":""}> À la Une</label><label class="chk"><input type="checkbox" id="br" ${a.breaking?"checked":""}> Dernière minute</label></div>
<p><button class="btn" id="sv">Enregistrer</button></p><div id="m" class="msg err"></div></div>`;
$("#back").onclick=e=>{e.preventDefault();dash()};
$("#f").onchange=e=>{const f=e.target.files[0];if(f){$("#prev").src=URL.createObjectURL(f);$("#prev").hidden=false}};
$("#sv").onclick=async()=>{const title=$("#t").value.trim();if(title.length<3)return say("Le titre est obligatoire (3 caractères min).");
const b=$("#sv");b.disabled=true;let image_url=$("#iu").value||null;const f=$("#f").files[0];
if(f){if(!/^image\/(jpeg|png|webp)$/.test(f.type)||f.size>5e6){b.disabled=false;return say("Image invalide (JPG/PNG/WebP, 5 Mo max).")}
const p=Date.now()+"-"+Math.random().toString(36).slice(2,7)+"."+f.type.split("/")[1];
const up=await sb.storage.from("article-images").upload(p,f,{contentType:f.type});
if(up.error){b.disabled=false;return say("Envoi de l'image impossible : "+up.error.message)}
image_url=sb.storage.from("article-images").getPublicUrl(p).data.publicUrl}
const row={title,category:$("#c").value,chapo:$("#ch").value.trim()||null,body:$("#b").value.trim()||null,author:$("#au").value.trim()||"Rédaction",tag:$("#tg").value.trim()||null,
image_url,published:$("#pu").checked,featured:$("#fe").checked,breaking:$("#br").checked,updated_at:new Date().toISOString()};
const r=n?await sb.from("articles").insert({...row,slug:(slugify(title)||"article")+"-"+Date.now().toString(36).slice(-4)}):await sb.from("articles").update(row).eq("id",a.id);
b.disabled=false;r.error?say("Échec : "+r.error.message):dash()}}

if(!C.SUPABASE_URL||!C.SUPABASE_ANON_KEY){app.innerHTML=`<div class="login box"><h1>Configuration requise</h1><p>Renseignez <code>SUPABASE_URL</code> et <code>SUPABASE_ANON_KEY</code> dans <code>config.js</code>, puis redéployez (voir LISEZ-MOI.md).</p></div>`}
else{sb=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY);$("#out").onclick=async()=>{await sb.auth.signOut();loginView()};start()}
</script></body></html>
